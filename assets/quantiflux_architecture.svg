<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 6px; }
      .box-active { fill: #1c2128; stroke: #58a6ff; stroke-width: 2; rx: 6px; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 14px; font-weight: bold; }
      .text-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
      .lane-label { fill: #58a6ff; font-family: sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowhead-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="600" />

  <!-- Lanes Lines -->
  <line x1="50" y1="140" x2="950" y2="140" stroke="#21262d" stroke-width="1.5" />
  <line x1="50" y1="280" x2="950" y2="280" stroke="#21262d" stroke-width="1.5" />
  <line x1="50" y1="420" x2="950" y2="420" stroke="#21262d" stroke-width="1.5" />

  <!-- Lane Labels -->
  <text x="60" y="40" class="lane-label">1. NÍVEL CONCEITUAL (TESE &amp; INVARIANTES)</text>
  <text x="60" y="170" class="lane-label">2. NÍVEL ESTRATÉGICO (PLANO DIREITOR &amp; ONDAS)</text>
  <text x="60" y="310" class="lane-label">3. NÍVEL TÁTICO (ISOLAMENTO DE CONTEXTO &amp; FANOUT)</text>
  <text x="60" y="450" class="lane-label">4. NÍVEL OPERACIONAL (EXECUÇÃO &amp; WAVE GATES)</text>

  <!-- Nodes -->
  <!-- Level 1 -->
  <g transform="translate(100, 60)">
    <rect class="box" width="220" height="60" />
    <text x="110" y="28" class="text-title" text-anchor="middle">Formular Tese Arquitetural</text>
    <text x="110" y="45" class="text-sub" text-anchor="middle">Definição de Invariantes</text>
  </g>

  <!-- Level 2 -->
  <g transform="translate(380, 200)">
    <rect class="box-active" width="240" height="60" />
    <text x="120" y="28" class="text-title" text-anchor="middle">Master Engineering Plan</text>
    <text x="120" y="45" class="text-sub" text-anchor="middle">Decomposição em Waves (0..N)</text>
  </g>

  <!-- Level 3 -->
  <g transform="translate(180, 340)">
    <rect class="box" width="200" height="60" />
    <text x="100" y="28" class="text-title" text-anchor="middle">Filtragem de Contexto</text>
    <text x="100" y="45" class="text-sub" text-anchor="middle">Isolamento de Escopo por Wave</text>
  </g>

  <g transform="translate(440, 340)">
    <rect class="box" width="220" height="60" />
    <text x="110" y="28" class="text-title" text-anchor="middle">Subagentes Táticos</text>
    <text x="110" y="45" class="text-sub" text-anchor="middle">delegate_task Fanout</text>
  </g>

  <!-- Level 4 -->
  <g transform="translate(440, 480)">
    <rect class="box" width="220" height="60" />
    <text x="110" y="28" class="text-title" text-anchor="middle">Operadores Especialistas</text>
    <text x="110" y="45" class="text-sub" text-anchor="middle">Execução / TDD Local</text>
  </g>

  <g transform="translate(730, 480)">
    <rect class="box-active" width="200" height="60" />
    <text x="100" y="28" class="text-title" text-anchor="middle">Wave Boundary Gate</text>
    <text x="100" y="45" class="text-sub" text-anchor="middle">pytest + git status clean</text>
  </g>

  <!-- Connectors -->
  <path d="M 320 90 L 500 90 L 500 200" class="arrow" />
  <path d="M 500 260 L 500 300 L 280 300 L 280 340" class="arrow" />
  <path d="M 380 370 L 440 370" class="arrow" />
  <path d="M 550 400 L 550 480" class="arrow" />
  <path d="M 660 510 L 730 510" class="arrow" />
  
  <!-- Loop Feedback -->
  <path d="M 830 480 L 830 370 L 660 370" class="arrow-dashed" />
  <text x="840" y="430" class="text-sub" fill="#8b949e">Próxima Onda</text>

</svg>