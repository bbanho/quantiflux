name: Build Documentation & SVG Assets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-latex-abnt:
    name: Compile ABNT LaTeX Document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: docs/abntex2
          compiler: pdflatex
          args: "-interaction=nonstopmode -file-line-error"

      - name: Upload Compiled PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantiflux-relatorio-abnt.pdf
          path: docs/abntex2/main.pdf

  generate-svg-assets:
    name: Validate and Render Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify SVG Assets Exist
        run: |
          ls -la assets/
          test -f assets/quantiflux_architecture.svg
          test -f quantiflux_operation_diagram.bpmn.xml
